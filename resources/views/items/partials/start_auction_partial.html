   
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                    Create an Auction!
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center " data-modal-toggle="crud-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <form class="p-4 md:p-5" method="post" hx-post="{% url 'create_auction' item.id %}" id="auction-form"
            hx-trigger="submit"  
            id="auction-form"
            hx-swap="innerHTML"
            hx-target="#crud-modal">
                {% csrf_token %}
                <div class="grid gap-4 mb-4 grid-cols-2">
                    <div class="col-span-2">
                        <label for="{{form.starting_time.id_for_label}}" class="block mb-2 text-sm font-medium text-gray-900">{{form.starting_time.label}}</label>
                        {{form.starting_time}}
                        {% if form.starting_time.errors %}
                            <p class="text-red-500 text-sm mt-1">{{ form.starting_time.errors.0 }}</p>
                        {% endif %}
                    </div>
                    <div class="col-span-2">
                        <label for="{{form.ending_time.id_for_label}}" class="block mb-2 text-sm font-medium text-gray-900">{{form.ending_time.label}}</label>
                        {{form.ending_time}}
                            <p class="text-red-500 text-sm mt-1">{{ form.ending_time.errors.0 }}</p>
                    </div>
                </div>
                <div class="flex justify-center mx-auto pt-3">
                    <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium text-sm px-5 py-2.5 text-center ">
                        Create Auction
                    </button>
                </div>
            </form>
        </div>
    </div>
