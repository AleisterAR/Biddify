<div id="additem-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-screen-lg max-h-full">
        <div class="relative bg-card shadow-2xl">
            <div class="flex items-center justify-between px-5 py-4 border-b border-ink/10">
                <h3 class="font-display text-2xl font-semibold">Add an object</h3>
                <button type="button" class="inline-flex w-11 h-11 items-center justify-center text-ink-faint hover:bg-gallery hover:text-ink" data-modal-toggle="additem-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close</span>
                </button>
            </div>
            <form class="p-4 md:p-5" x-data="item_register" x-clover-form="submit" id="registerForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="grid gap-6 md:grid-cols-2">
                    <div>
                        <div class="p-2">
                            <div class="mb-2 flex justify-between items-center">
                              <span class="field-label mb-0">Photos</span>
                              <button type="button" id="select-button" class="button-quiet min-h-[36px] px-3">Choose photos</button>
                            </div>
                            <input id="file-input" type="file" multiple class="hidden" accept=".png, .jpg, .jpeg" />
                            <div class="flex mb-4 flex-col">
                              <div id="drop-zone" class="w-full h-48 border-2 border-dashed border-ink/20 flex flex-col gap-1 justify-center items-center text-ink-soft transition-colors">
                                <span class="font-semibold">Drop photos here</span><span class="text-sm text-ink-faint">PNG or JPG. The first photo becomes the cover.</span>
                              </div>
                              <div id="selected-files-count" class="mt-2 text-ink-soft text-sm font-medium"></div>
                              <div id="selected-images" class="flex flex-wrap gap-2 mt-3"></div>
                            </div>
                          </div>
                    </div>
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2">
                            <label for="name" class="field-label">Name</label>
                            <input x-clover-verify type="text" name="name" id="name" class="field" placeholder="For example, Brass carriage clock">
                            <div x-text="errors.name" class="field-error"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                          <label for="category" class="field-label">Category</label>
                          <select x-clover-verify id="category" name="category" class="field">
                            <option value="" disabled selected>Select an item category</option>
                            {% for category in categories %}
                                <option value="{{category}}">{{category}}</option>
                              {% endfor %}
                          </select>
                          <div x-text="errors.category" class="field-error"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="price" class="field-label">Opening price (€)</label>
                            <input type="text" name="price" id="price" oninput="this.value = this.value.replace(/[^0-9]/g, '');" class="field" placeholder="50">
                            <div x-text="errors.price" class="field-error"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                          <label for="creator" class="field-label">Creator</label>
                          <input type="text" name="creator" id="creator" class="field" placeholder="Maker, artist or workshop">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                          <label for="country" class="field-label">Country</label>
                          <select id="country" name="country" class="field">
                            <option value="" selected>Select a country of origin</option>
                            {% for core, country_name in countries %}
                                <option value="{{core}}">{{country_name}}</option>
                              {% endfor %}
                          </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                          <label for="year" class="field-label">Year of origin</label>
                          <input x-clover-verify type="text" name="year" id="year" min="1000" max="2024" class="field" placeholder="1890">
                          <div x-text="errors.year" class="field-error"></div>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label for="condition" class="field-label">Condition</label>
                            <select x-clover-verify id="condition" name="condition" class="field">
                              <option value="" disabled selected>Select an item condition</option>
                              {% for value, display in condition_choices %}
                                <option value="{{value}}">{{display}}</option>
                              {% endfor %}
                            </select>
                            <div x-text="errors.condition" class="field-error"></div>
                        </div>
                        <div class="col-span-2">
                            <label for="description" class="field-label">Description</label>
                            <textarea x-clover-verify id="description" name="description" rows="4" class="field" placeholder="Materials, size, marks, history and any damage"></textarea>
                            <div x-text="errors.description" class="field-error"></div>                      
                        </div>
                        <div class="col-span-2">
                          <label class="field-label">Provenance document</label>
                          <input x-clover-verify accept=".pdf, .png, .jpg, .jpeg" class="block w-full text-sm text-ink border border-ink/20 cursor-pointer bg-card file:me-3 file:min-h-[44px] file:px-4 file:border-0 file:bg-gallery-deep file:text-ink file:font-semibold" aria-describedby="file_input_help" id="provenance" name="provenance" type="file">
                          <p class="mt-1.5 text-sm text-ink-soft" id="file_input_help">A certificate, receipt or photo that shows where the object came from. PNG, JPG or PDF.</p>
                          <div x-text="errors.provenance" class="field-error"></div> 
                        </div>
                    </div>
                </div>
                <div class="mt-2 pt-4 border-t border-ink/10 flex justify-end">
                    <button type="submit" class="button">Add to inventory</button>
                </div>
            </form>
        </div>
    </div>
</div>
