<a class="swapable-a flex gap-3 px-4 py-3 bg-gallery/60 smooth-transition hover:bg-gallery">
    <span class="mt-1.5 w-2 h-2 shrink-0 rounded-full bg-transparent"></span>
    <div class="w-full">
      <div class="text-sm text-ink mb-1">{{ notification.message }}</div>
      <div class="text-xs text-ink-faint" data-time-ago="{{ notification.created_at|date:'c' }}"></div>
    </div>
    <button type="button" aria-label="Delete notification" class="self-start text-ink-faint hover:text-outbid" hx-delete="{% url "delete_notification" notification.message %}">
      {% include 'utilities/partials/notification_close_icon.html' %}
    </button>
  </a>

  <div id="new-noti-indicator" hx-swap-oob="innerHTML">
    {% if has_unread %}
      <div class="absolute block w-3 h-3 bg-paddle border-2 border-card rounded-full top-2.5 end-2.5 animate-pulse"></div>
    {% endif %}
  </div>
