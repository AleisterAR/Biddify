{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/global.css' %}?{% now 'U' %}">
  <script defer src="{% static 'js/app.js' %}?{% now 'U' %}"></script>
  <script defer src="{% static 'js/htmx.min.js' %}?{% now 'U' %}"></script>
  <script defer src="{% static 'js/htmx.ws.js' %}?{% now 'U' %}"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="{% static 'common/logo.ico' %}">
  <title>Biddify</title>
</head>

<body class="h-full">
  <div class="flex flex-col min-h-screen">
    <header>
      {% include 'utilities/navbar.html' %}
    </header>
    <main class="flex-grow">
      {% block content %}
  
      {% endblock content %}
    </main>
    <footer class="bg-white footer-border mt-5">
      {% include 'utilities/footer.html' %}
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
  <script>
    document.body.addEventListener('htmx:configRequest', (event) => {
      event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    })
    const noti = document.getElementById("noti-div");
    const wsNotificationUrl = 'ws://' + window.location.host + '/ws/notifications/' + '{{request.user.id}}/';
    noti.setAttribute("ws-connect", wsNotificationUrl)
  </script>
</body>

</html>
